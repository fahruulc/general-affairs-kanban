services:
  db:
    image: postgres:17-alpine
    container_name: lapor_ga_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lapor
      POSTGRES_PASSWORD: lapor
      POSTGRES_DB: lapor_ga
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapor -d lapor_ga"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: ${S3_IMAGE:-minio/minio:latest}
    container_name: lapor_ga_s3
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: localaccess
      MINIO_ROOT_PASSWORD: localsecret123
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
